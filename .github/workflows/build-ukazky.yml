name: Build ukázek

on:
  push:
    paths:
      - "**/*.csproj"
      - "**/*.cs"
      - "**/*.xaml"
      - ".github/workflows/build-ukazky.yml"
  pull_request:
    paths:
      - "**/*.csproj"
      - "**/*.cs"
      - "**/*.xaml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sln:
    # Jen na push/manuální spuštění — u pull_requestu bychom neměli kam
    # commit pushnout (checkout je na merge commitu, ne na větvi).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Vygenerovat chybějící .sln
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          while IFS= read -r -d '' csproj; do
            dir=$(dirname "$csproj")
            name=$(basename "$csproj" .csproj)
            sln="$dir/$name.sln"
            if [ ! -f "$sln" ]; then
              echo "Vytvářím $sln"
              # --format sln: novější SDK defaultně generuje .slnx, ale
              # ostatní ukázky v repu mají klasický .sln — ať jsou všechny
              # stejné a otevřou se v každé Visual Studiu.
              (cd "$dir" && dotnet new sln -n "$name" --format sln && dotnet sln add "$(basename "$csproj")")
              changed=1
            fi
          done < <(find . -name '*.csproj' -not -path './.git/*' -print0)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Commitnout nové .sln
        if: steps.generate.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*.sln'
          git commit -m "Automaticky vygenerovat .sln pro nové ukázky"
          git push

  build:
    # windows-latest, protože WinForms a WPF (net8.0-windows) jinde nejdou
    # sestavit — konzolové projekty se sestaví stejně dobře.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Sestavit všechny ukázkové projekty
        shell: pwsh
        run: |
          $projekty = Get-ChildItem -Path . -Recurse -Filter *.csproj
          if ($projekty.Count -eq 0) {
            Write-Host "Žádné .csproj soubory k sestavení."
            exit 0
          }

          $chyby = @()
          foreach ($projekt in $projekty) {
            Write-Host "== Sestavuji $($projekt.FullName) =="
            dotnet build $projekt.FullName --configuration Release
            if ($LASTEXITCODE -ne 0) {
              $chyby += $projekt.FullName
            }
          }

          if ($chyby.Count -gt 0) {
            Write-Host "Sestavení selhalo u:"
            $chyby | ForEach-Object { Write-Host " - $_" }
            exit 1
          }
